<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 外側の円（下半分：白） -->
  <circle cx="32" cy="32" r="28" fill="#ffffff" />

  <!-- 上半分：赤（本家テーマのローズレッド） -->
  <path d="M4 32 A28 28 0 0 1 60 32 Z" fill="#e11d48" />

  <!-- さりげない光沢ハイライト -->
  <path
    d="M15 20 A18 18 0 0 1 28 11"
    fill="none"
    stroke="#fda4af"
    stroke-width="3.5"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- 外枠 -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#1e293b" stroke-width="5" />

  <!-- 中央の黒い帯 -->
  <line x1="4" y1="32" x2="60" y2="32" stroke="#1e293b" stroke-width="6" />

  <!-- 中央のボタン（外輪・白丸・内丸） -->
  <circle cx="32" cy="32" r="10" fill="#ffffff" stroke="#1e293b" stroke-width="5" />
  <circle cx="32" cy="32" r="4" fill="#14b8a6" />
</svg>
